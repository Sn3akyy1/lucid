# cava config for the Lucid media visualiser.
# the bar strip parses whitespace-separated ascii values, one frame per
# line, so the [output] block here is required - cava's own defaults emit
# ncurses output instead and the strip reads it as a single huge bar.

[general]
bars = 40
framerate = 60
autosens = 1

[smoothing]
noise_reduction = 55

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 32
frame_delimiter = 10
