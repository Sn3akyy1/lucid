# Per-output wallpaper rules, read by set-wallpaper.sh every time the wallpaper
# changes. One rule a line:
#
#   <output>  <extra arguments for `awww img` / `swww img`>
#
# Any argument that is a file becomes that output's picture; everything else is
# passed straight to the wallpaper daemon. Outputs with no rule get the
# wallpaper you picked, cropped to fill, as they always have.
# `qs ipc call displays list` prints your outputs, left to right.
#
# The same wallpaper, letterboxed rather than cropped on a portrait screen:
#   DP-3  --resize fit --fill-color 000000
#
# A picture of its own on the second screen:
#   HDMI-A-1  ~/Pictures/wallpapers/second.jpg
