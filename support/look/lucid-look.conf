# Lucid — window look (classic Hyprland syntax)
#
# The blur is what turns kitty's background_opacity into frosted glass, and
# what the shell's own surfaces sample. Trim anything you'd rather keep your
# own; nothing here is required for Lucid to run.

decoration {
    rounding = 25
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 9
        passes = 3
        vibrancy = 0.1696
        noise = 0.04
        ignore_opacity = true
    }
}
