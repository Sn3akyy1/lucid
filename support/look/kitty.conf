# Lucid — kitty
# The colours live in matugen-colors.conf and the opacity in lucid-glass.conf,
# both rewritten by Lucid. Keep the includes last so they win over anything
# set above them.

# kitty opens fish rather than the login shell
shell fish

font_family      JetBrainsMono Nerd Font Mono
font_size 10.0

window_padding_width 25

include ./matugen-colors.conf

# translucency follows Settings > General > Glass; the frost itself comes
# from Hyprland's blur. keep this include last so it wins, and note that
# dynamic_background_opacity only takes effect in a window kitty has just
# started, so the first window after an install has to be reopened once
include ./lucid-glass.conf
